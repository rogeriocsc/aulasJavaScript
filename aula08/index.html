<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/img-favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/script.js" defer></script>
    <title>Produto Promocional</title>
</head>
<body>
    <main>
        <section class="projeto-produto">
            <div class="img"></div>
            <div class="campos-produto">
                <h1>Produto Promocional</h1>
                <div class="campo">
                    <label for="i_prod">Produto</label>
                    <input type="text" name="produto" id="i_prod" placeholder="Informe o produto">
                </div>
                <div class="campo">
                    <label for="i_preco">Preço R$</label>
                    <input type="number" name="preco" id="i_preco" placeholder="Informe o preço R$" min="0">
                </div>
                <div class="campo">
                    <select id="operacao">
                        <option value="">Selecionar</option>
                        <option value="A">Desconto 5%</option>
                        <option value="B">Desconto 10%</option>
                        <option value="C">Desconto 15%</option>
                        <option value="D">Desconto 20%</option>
                    </select>
                </div>
                <button type="button" onclick="calcular()">
                    Verificar
                </button>
                <div class="resposta" id="res">
                    <p>Verificando...</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
