<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/img-favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/script.js" defer></script>
    <title>Média de Valores</title>
</head>
<body>
    <main>
        <section class="projeto-media">
            <div class="img"></div>
            <div class="media">
                <h1>Média de Valores</h1>
                <div class="campo">
                    <label for="i_val1">Primeiro Valor</label>
                    <input type="number" name="valor1" id="i_val1" placeholder="Informe o Primeiro Valor" min="0">
                </div>
                <div class="campo">
                    <label for="i_val2">Segundo Valor</label>
                    <input type="number" name="valor2" id="i_val2" placeholder="Informe o Segundo Valor" min="0">
                </div>
                <button type="button" onclick="media()">
                    Calcular
                </button>
                <div class="resposta" id="res">
                    <p>Calculando...</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
