<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/script.js" defer></script>
    <title>Calcular Idade</title>
</head>
<body>
    <main>
        <section class="projeto-idade">
            <div class="img"></div>
            <div class="campos-idade">
                <h1>Calcular Idade</h1>
                <div class="campo">
                    <label for="a_atual">Ano Atual</label>
                    <input type="number" name="ano_atual" id="a_atual" placeholder="Ano Atual" min="0">
                </div>
                <div class="campo">
                    <label for="a_nasc">Ano Nascimento</label>
                    <input type="number" name="ano_nasc" id="a_nasc" placeholder="Ano Nascimento" min="0">
                </div>
                <button type="button" onclick="calcular()">
                    Calcular
                </button>
                <div class="resposta" id="res">
                    <p>Calculando...</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
