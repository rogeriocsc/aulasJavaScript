<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/script.js" defer></script>
    <title>Situação do Aluno</title>
</head>
<body>
    <main>
        <section class="projeto-aluno">
            <div class="img"></div>
            <div class="campos-aluno">
                <h1>Situação do Aluno</h1>
                <div class="campo">
                    <label for="i_nota1">Primeira Nota</label>
                    <input type="number" name="nota1" id="i_nota1" placeholder="Informe a Primeira Nota">
                </div>
                <div class="campo">
                    <label for="i_nota2">Segunda Nota</label>
                    <input type="number" name="nota2" id="i_nota2" placeholder="Informe a Segunda Nota">
                </div>
                <button type="button" onclick="calcular()">
                    Calcular
                </button>
                <div class="resposta" id="res">
                    <p>Calculando...</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
